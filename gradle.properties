org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 本项目目录名含中文（password开源版），关闭 AGP 的非 ASCII 路径检查。
android.overridePathCheck=true
kotlin.code.style=official

# AGP 9.x requires JDK 21+. If your system JAVA_HOME points at an older JDK,
# pin the Gradle JVM to a locally installed JDK 21 in your *user-level*
# gradle.properties (~/.gradle/gradle.properties), e.g.:
#   org.gradle.java.home=/path/to/jdk-21
# It is machine specific and therefore deliberately not committed here.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
