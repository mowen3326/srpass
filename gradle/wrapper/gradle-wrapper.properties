distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# CN mirror: services.gradle.org fails the TLS handshake on this network
# (PKIX path building failed). Both of these host Gradle distributions:
#   https://mirrors.cloud.tencent.com/gradle/
#   https://mirrors.huaweicloud.com/gradle/
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.1-bin.zip
networkTimeout=10000
# Must stay false: the URL is a mirror, so official validation would reject it,
# and validation itself requires the unreachable services.gradle.org.
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
