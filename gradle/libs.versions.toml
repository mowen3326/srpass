[versions]
# 9.3.0 supports compileSdk 37 (Android 17) and works with the pinned
# Gradle 9.7.1 wrapper (verified: assembleRelease passes).
agp = "9.3.0"
kotlin = "2.3.0"
# KSP must track the Kotlin version (2.3.x). 2.3.6 verified with Kotlin 2.3.0.
ksp = "2.3.6"

# 2026.06.00 is known to fail resolution; 2026.05.01 is the latest working BOM.
composeBom = "2026.05.01"

# 1.19.0 requires compileSdk >= 37 AND AGP >= 9.1.0. Both are now satisfied
# (android-37.2 installed, AGP 9.3.0 in use), so the latest version is used.
coreKtx = "1.19.0"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
biometric = "1.1.0"

# KDBX (KeePass) format support: encryption + file format, no crypto written by hand.
kotpass = "0.13.0"

# Argon2id. BouncyCastle is used only for Argon2BytesGenerator, which is a
# plain algorithmic class and does NOT go through the JCA Provider mechanism.
# That deliberately sidesteps the well-known Android BouncyCastle provider
# clash -- AES/GCM still uses the platform's own provider.
bcprov = "1.79"

junit = "4.13.2"

# Real org.json for local JVM tests. Android ships it on device, but the
# desktop stub throws "not mocked" the moment note serialisation runs.
json = "20240303"

# Authenticator module: CameraX (Jetpack, actively maintained) runs the preview
# and hands us frames; ZXing decodes them. Both are fully local -- no Play
# Services and no network, which this app must not use anyway.
camera = "1.6.2"
zxing = "3.5.4"

# Reads the EXIF orientation of an imported photo (androidx.exifinterface).
exifinterface = "1.3.7"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Managed by the Compose BOM - no explicit versions below.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

kotpass = { group = "app.keemobile", name = "kotpass", version.ref = "kotpass" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bcprov" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "json" }

androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camera" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camera" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
